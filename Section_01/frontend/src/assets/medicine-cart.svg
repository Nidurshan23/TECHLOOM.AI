<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Medicine bottle and capsules</title>
  <desc id="desc">Orange medicine bottle with black cap and red capsules.</desc>
  <defs>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3f00"/>
      <stop offset="18%" stop-color="#ff7b1c"/>
      <stop offset="55%" stop-color="#c75700"/>
      <stop offset="100%" stop-color="#ff9645"/>
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="50%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#b9b9b9"/>
    </linearGradient>
    <linearGradient id="pillLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#9eacbf"/>
    </linearGradient>
    <linearGradient id="pillRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4747"/>
      <stop offset="100%" stop-color="#ba0000"/>
    </linearGradient>
  </defs>

  <rect x="430" y="20" width="240" height="40" rx="16" fill="url(#cap)"/>
  <rect x="430" y="45" width="240" height="110" rx="14" fill="#111"/>
  <g opacity="0.95">
    <rect x="440" y="55" width="12" height="90" fill="#444"/>
    <rect x="462" y="55" width="12" height="90" fill="#ddd"/>
    <rect x="484" y="55" width="12" height="90" fill="#555"/>
    <rect x="506" y="55" width="12" height="90" fill="#eee"/>
    <rect x="528" y="55" width="12" height="90" fill="#666"/>
    <rect x="550" y="55" width="12" height="90" fill="#f7f7f7"/>
    <rect x="572" y="55" width="12" height="90" fill="#737373"/>
    <rect x="594" y="55" width="12" height="90" fill="#ddd"/>
    <rect x="616" y="55" width="12" height="90" fill="#555"/>
    <rect x="638" y="55" width="12" height="90" fill="#222"/>
  </g>
  <rect x="430" y="135" width="240" height="22" rx="10" fill="url(#cap)"/>

  <rect x="470" y="160" width="170" height="40" rx="8" fill="#f07818"/>
  <rect x="390" y="200" width="350" height="350" rx="44" fill="url(#bottle)"/>
  <rect x="390" y="285" width="350" height="40" fill="#bcc5d1"/>
  <rect x="390" y="445" width="350" height="34" fill="#b4becd"/>
  <rect x="390" y="325" width="350" height="120" fill="url(#label)"/>
  <rect x="410" y="350" width="60" height="80" fill="#ff5252"/>
  <rect x="400" y="350" width="160" height="16" fill="#ff5252"/>
  <rect x="482" y="372" width="220" height="24" fill="#3b3b3b"/>
  <rect x="482" y="406" width="220" height="12" fill="#3b3b3b"/>
  <rect x="482" y="428" width="110" height="10" fill="#3b3b3b"/>
  <rect x="390" y="478" width="350" height="95" rx="24" fill="url(#bottle)"/>

  <g transform="translate(120 470) rotate(-45)">
    <rect x="0" y="0" width="150" height="70" rx="35" fill="url(#pillLight)"/>
    <path d="M75 0h40a35 35 0 0 1 0 70H75z" fill="url(#pillRed)"/>
    <rect x="73" y="0" width="4" height="70" fill="#1b1b1b"/>
  </g>
  <g transform="translate(0 500)">
    <rect x="0" y="0" width="120" height="70" rx="35" fill="url(#pillLight)"/>
    <path d="M60 0h60a35 35 0 0 1 0 70H60z" fill="url(#pillRed)"/>
    <rect x="58" y="0" width="4" height="70" fill="#1b1b1b"/>
  </g>
